# Verification gate (CLAUDE.md §0.4): every push and pull request must pass
# typecheck, lint, unit tests, production build, E2E (desktop + 2 phones)
# and the docs check.
name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs:check compares the PR against its base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # Local Supabase (Postgres, Auth, Storage, Mailpit) in Docker, exactly as in development.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime
      - name: Database tests (RLS, invites, admin functions)
        run: npm run test:db

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      - name: Docs check
        run: npm run docs:check
        env:
          # Only pull requests have a base to compare against.
          DOCS_CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
